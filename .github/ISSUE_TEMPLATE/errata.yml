name: Errata
description: A mistake in the text, an example program or a solution.
title: "Errata: "
labels: [errata]
body:
  - type: markdown
    attributes:
      value: >-
        Thank you for reporting it. One mistake per issue makes it
        easier to fix and to check.
  - type: input
    id: location
    attributes:
      label: Where
      description: >-
        The chapter or appendix and the section, or the link to the page
        (for example https://asm64.rovisoft.net/05-dealing-with-files),
        or the name of the example program.
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Format
      options:
        - Website
        - PDF
        - ePUB
        - Example programs (resource.zip or the repository)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: >-
        For the PDF or the ePUB, the release you downloaded (for example
        v2026.11.25). Leave it empty for the website.
  - type: textarea
    id: text
    attributes:
      label: What it says
      description: The text, code or output that is wrong, copied as it is.
      render: text
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: What it should say
      description: >-
        What you think is right, and why. For a program, the commands
        you ran and their output help a lot.
    validations:
      required: true
