name: Check links

# Links break slowly, and a broken link elsewhere should not block a
# pull request, so the check runs once a week instead of on every push.
# It also runs when its own configuration changes.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC.
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - lychee.toml
      - .github/workflows/links.yml

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config lychee.toml --no-progress
            'src/**/*.qmd' '*.md' 'src/resource/**/*.md'
          fail: true
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
